<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เทคโนโลยีสารสนเทศ 2/1</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      overflow-x: hidden;
    }

    /* Sidebar desktop */
    .sidebar {
      width: 250px;
      height: 100vh;
      position: fixed;
      top: 56px; /* ความสูง navbar */
      left: 0;
      background: #343a40;
      padding-top: 10px;
    }

    .sidebar a {
      color: white;
      display: block;
      padding: 10px 15px;
      text-decoration: none;
    }

    .sidebar a:hover {
      background: #495057;
    }

    /* Content */
    .content {
      margin-left: 250px;
      padding: 20px;
      margin-top: 56px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        left: -250px;
        transition: 0.3s;
      }

      .sidebar.active {
        left: 0;
      }

      .content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary fixed-top">
  <div class="container-fluid">

    <!-- กลุ่มฝั่งซ้าย -->
    <div class="d-flex align-items-center">
      <button class="btn btn-outline-light me-2" onclick="toggleSidebar()">☰</button>
      <span class="navbar-brand mb-0 h1">เทคโนโลยีสารสนเทศ 2/1</span>
    </div>

  </div>
</nav>

<!-- Sidebar -->
<div id="sidebar" class="sidebar" style="margin-top: -10px;">

  <a href="#">Menu 2</a>
  <a href="#">Menu 2</a>
  <a href="#">Menu 4</a>
</div>

<!-- Content -->
<div class="content">
  <h3>หน้าหลัก</h3>
</div>

<script>
  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
